[package]
name = "cutr"
version = "0.1.0"
edition = "2024"
description = "Rust version of `cut`"
authors = ["Jerry Lin <jclin18@gmail.com>"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
csv = "1.4.0"
regex = "1.13.1"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
pretty_assertions = "1.4.1"
rand = "0.10.2"
