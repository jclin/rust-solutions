[package]
name = "calr"
version = "0.1.0"
edition = "2024"
authors = ["Jerry Lin <jclin18@gmail.com>"]
description = "Rust version of `cal`"

[dependencies]
ansi_term = "0.12.1"
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
itertools = "0.15.0"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
pretty_assertions = "1.4.1"
