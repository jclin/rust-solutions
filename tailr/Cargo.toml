[package]
name = "tailr"
version = "0.1.0"
edition = "2024"
authors = ["Jerry Lin <jclin18@gmail.com>"]
description = "Rust version of `tail`"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
linecount = "0.1.0"
num = "0.4.3"
once_cell = "1.21.4"
regex = "1.13.1"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
pretty_assertions = "1.4.1"
rand = "0.10.2"
